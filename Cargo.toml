[package]
name = "lmp"
version = "0.1.0"
edition = "2024"

# Building the macOS app: cargo bundle --release
[package.metadata.bundle]
name = "LMP"
identifier = "com.fedor-ivanov.lmp"
icon = ["assets/images/AppIcon.icns"]
category = "public.app-category.music"
short_description = "Audio player"

[dependencies]
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
lofty = "0.25.4"
symphonia = { version = "0.6.1", features = [
    "mp3",
    "flac",
    "wav",
    "ogg",
    "aac",
    "isomp4",
] }
rodio = "0.23.0"
egui = "0.37.0"
# persistence — for eframe::storage_dir (the data folder for the library); eframe also
# remembers the window size and panel widths between launches
eframe = { version = "0.37", features = ["persistence"] }
rfd = "0.17.2"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
fastrand = "2"
raw-window-handle = "0.6"
encoding_rs = "0.8.42"
# System media keys and "Control Center" (macOS), media overlay (Windows)
souvlaki = "0.8.3"
# Lyrics requests to LRCLIB (see src/core/lyrics/lrclib.rs)
ureq = { version = "3.5.0", features = ["json"] }

# System blur under the transparent window (see src/ui/style/window_glass.rs)
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSGeometry", "NSString", "NSThread"] }
objc2-app-kit = { version = "0.3", features = [
    "NSAppearance",
    "NSEvent",
    "NSGraphics",
    "NSResponder",
    "NSView",
    "NSVisualEffectView",
    "NSWindow",
] }

[target.'cfg(target_os = "windows")'.dependencies]
# On Windows the window is rendered via OpenGL (glow), not wgpu — see window_glass.rs
eframe = { version = "0.37", features = ["glow"] }
window-vibrancy = "0.8.1"
# Window glass (src/ui/style/window_glass.rs) and the cursor position while files are
# dragged over the window (src/ui/file_drop.rs)
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
winresource = "0.1.34"

# Debug build (cargo run): dependencies are optimized. Without that, decoding
# covers (image), reading tags and audio are several times slower: a cover takes ~110 ms
# instead of ~6. Our own code stays in debug; dependencies are built this way once
[profile.dev.package."*"]
opt-level = 3
